# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Check Firebase Web Push configuration
        run: test -n "$FIREBASE_VAPID_KEY"
      - run: flutter build web --dart-define="FIREBASE_VAPID_KEY=$FIREBASE_VAPID_KEY"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NUS_NUS }}'
          channelId: live
          projectId: nus-nus
